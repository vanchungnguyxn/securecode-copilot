# Production / staging stack — pulls pre-built images from GHCR (no local build).
#
# Required env (see deploy/.env.example or GitHub Actions):
#   BACKEND_IMAGE=ghcr.io/<owner>/securecode-copilot-backend:<tag>
#   FRONTEND_IMAGE=ghcr.io/<owner>/securecode-copilot-frontend:<tag>
#
# Optional:
#   APP_URL=https://app.example.com
#   CORS_ORIGINS=https://app.example.com
#   DATABASE_URL=sqlite:///./data/scc.db
#   JWT_SECRET=change-me
#   LLM_PROVIDER=heuristic

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-heuristic}
      USE_ML_DETECTOR: ${USE_ML_DETECTOR:-false}
      USE_ML_DISCOVERY: ${USE_ML_DISCOVERY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/scc.db}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}
      BILLING_MOCK: ${BILLING_MOCK:-true}
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      - scc_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  scc_data:
