<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title if page else "SimpleCMS" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">Green Leaf Studio</a>
    <nav>
      <a href="#about">Giới thiệu</a>
      <a href="{{ url_for('admin_login') }}">Admin</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>{{ page.title }}</h1>
      <p>{{ page.body }}</p>
    </section>

    <section id="about" class="about">
      <h2>{{ about.title }}</h2>
      <p>{{ about.body }}</p>
    </section>
  </main>

  <footer>
    <p>SimpleCMS demo · chỉ chạy local</p>
  </footer>
</body>
</html>
