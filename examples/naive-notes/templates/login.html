<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>MyNotes — Đăng nhập</title>
  <style>
    body { font-family: Georgia, serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; background: #f7f3ee; color: #1a1a1a; }
    input, button { display: block; width: 100%; margin: 0.5rem 0; padding: 0.5rem; box-sizing: border-box; }
    a { color: #2c5f4a; }
    .err { color: #8b1a1a; }
  </style>
</head>
<body>
  <h1>MyNotes</h1>
  <p>Đăng nhập để xem ghi chú</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post">
    <input name="username" placeholder="Username" required />
    <input name="password" type="password" placeholder="Password" required />
    <button type="submit">Đăng nhập</button>
  </form>
  <p><a href="{{ url_for('register') }}">Tạo tài khoản</a></p>
</body>
</html>
